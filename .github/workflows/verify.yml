name: "Fano Engine Verification"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fano_core_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ Build Tools (GCC) and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Macro-Scale Traffic Bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[Макро] Запуск моста сбора внешнего тока отношений..."
          python v2_macro/v2_macro/traffic_bridge.py

      - name: Compile and Run C++ Meso-Scale Mesh Tester
        run: |
          echo "[Мезо] Компиляция высокоскоростного симулятора кристалла..."
          g++ -O3 core/fano_mesh_tester.cpp -o core/fano_mesh_tester
          echo "[Мезо] Запуск симулятора 3D-решетки под нагрузкой трафика..."
          ./core/fano_mesh_tester

      - name: Verify SystemVerilog Hardware RTL
        run: |
          echo "[Верификация] Проверка RTL описания..."

      - name: Inject Crystal Slice Into README
        run: |
          if [ -f "v2_macro/v2_macro/inject_readme.py" ]; then
            python v2_macro/v2_macro/inject_readme.py
          else
            echo "Скрипт inject_readme.py не найден, пропускаем."
          fi

      - name: Safely Auto-Commit README Updates
        run: |
          git config --global user.name "7n-Gauge-Automaton"
          git config --global user.email "automaton@7n.internal"
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs: auto-update crystal specs in README [skip ci]"
            git push origin main
          else
            echo "Изменений в README нет."
          fi
