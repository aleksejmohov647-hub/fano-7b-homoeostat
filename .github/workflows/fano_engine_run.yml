name: "Fano-Desargues Multi-Scale Gauge Trap"

on:
  schedule:
    - cron: '0 * * * *' # Автоматический запуск ловушки каждый час
  workflow_dispatch:   # Позволяет запускать ловушку вручную кнопкой
  push:
    branches:
      - main
    paths-ignore:
      - '**/fano_params.vh'
      - '**/fano_config.txt'

permissions:
  contents: write

jobs:
  calibrate_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Macro-Scale Traffic Bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[Макро] Запуск моста сбора внешнего тока отношений..."
          python v2_macro/v2_macro/traffic_bridge.py

      - name: Compile and Run C++ Meso-Scale Mesh Tester
        run: |
          echo "[Мезо] Поиск и компиляция симулятора кристалла..."
          # Ищем c++ файл, даже если он лежит внутри подпапок
          CPP_FILE=$(find . -name "fano_mesh_tester.cpp" | head -n 1)
          if [ -n "$CPP_FILE" ]; then
            DIR_PATH=$(dirname "$CPP_FILE")
            g++ -O3 "$CPP_FILE" -o "$DIR_PATH/fano_mesh_tester"
            echo "[Мезо] Запуск симулятора 3D-решетки под нагрузкой трафика..."
            "$DIR_PATH/fano_mesh_tester"
          else
            echo "[Предупреждение] fano_mesh_tester.cpp не найден, пропускаем шаг."
          fi

      - name: Auto-Commit Refined Dimension Scales (The Trap)
        run: |
          git config --global user.name "7n-Gauge-Automaton"
          git config --global user.email "automaton@7n.internal"
          
          # Автоматически находим, где в репозитории лежат эти файлы
          TARGET_FILE=$(find . -name "fano_params.vh" | head -n 1)
          CONFIG_FILE=$(find . -name "fano_config.txt" | head -n 1)
          
          CHANGES_FOUND=false
          
          if [ -n "$TARGET_FILE" ] && [ -n "$(git status --porcelain "$TARGET_FILE")" ]; then
            git add "$TARGET_FILE"
            CHANGES_FOUND=true
          fi
          
          if [ -n "$CONFIG_FILE" ] && [ -n "$(git status --porcelain "$CONFIG_FILE")" ]; then
            git add "$CONFIG_FILE"
            CHANGES_FOUND=true
          fi
          
          if [ "$CHANGES_FOUND" = true ]; then
            echo "[Топология] Обнаружено изменение фазы! Запись размерностей..."
            git commit -m "chore(core): auto-recalibration of 3D crystal dimensions [phase mod 13] [skip ci]"
            git push origin main
          else
            echo "[Вакуум] Изменений фазы нет или файлы не найдены, система удерживает форму. Стабилизация."
          fi
