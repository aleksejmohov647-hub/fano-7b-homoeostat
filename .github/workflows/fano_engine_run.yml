name: "Fano-Desargues Multi-Scale Gauge Trap"

on:
  schedule:
    - cron: '0 * * * *' # Автоматический запуск ловушки каждый час
  workflow_dispatch:   # Позволяет запускать ловушку вручную кнопкой
  push:
    branches:
      - main
    paths-ignore:
      - 'core/fano_params.vh'
      - 'core/fano_config.txt'

permissions:
  contents: write

jobs:
  calibrate_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Macro-Scale Traffic Bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[Макро] Запуск моста сбора внешнего тока отношений..."
          # ИСПРАВЛЕНО: Файл запускается из корня репозитория
          python traffic_bridge.py

      - name: Compile and Run C++ Meso-Scale Mesh Tester
        run: |
          echo "[Мезо] Компиляция высокоскоростного симулятора кристалла..."
          g++ -O3 core/fano_mesh_tester.cpp -o core/fano_mesh_tester
          echo "[Мезо] Запуск симулятора 3D-решетки под нагрузкой трафика..."
          ./core/fano_mesh_tester

      - name: Auto-Commit Refined Dimension Scales (The Trap)
        run: |
          git config --global user.name "7n-Gauge-Automaton"
          git config --global user.email "automaton@7n.internal"
          
          TARGET_FILE="core/fano_params.vh"
          CONFIG_FILE="core/fano_config.txt"
          
          if [ -n "$(git status --porcelain $TARGET_FILE)" ] || [ -n "$(git status --porcelain $CONFIG_FILE)" ]; then
            echo "[Топология] Обнаружено изменение фазы! Запись размерностей..."
            git add $TARGET_FILE $CONFIG_FILE
            git commit -m "chore(core): auto-recalibration of 3D crystal dimensions [phase mod 13] [skip ci]"
            git push origin main
          else
            echo "[Вакуум] Изменений фазы нет, система удерживает форму. Стабилизация."
          fi
