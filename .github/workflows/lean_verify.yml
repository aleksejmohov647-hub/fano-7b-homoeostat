name: Build & Check Zero-Sorry

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-lean:
    name: Verify Lean 4 Certificates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          gh release download -R leanprover/lean4 -p "*linux.tar.zst" -O lean.tar.zst
          tar -xf lean.tar.zst
          mv lean-*-linux "$HOME/lean4"
          echo "$HOME/lean4/bin" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find and verify Lean 4 files
        run: |
          FILES=$(find . -name "*.lean" -not -path "./.lake/*")
          if [ -z "$FILES" ]; then
            echo "Error: No .lean files found in repository!"
            exit 1
          fi

          for file in $FILES; do
            echo "Checking $file..."
            if grep -nE "^[[:space:]]*(axiom\b|.*:=\s*sorry\b|\bsorry\b)" "$file"; then
              echo "Error: 'sorry' or custom 'axiom' found in $file!"
              exit 1
            fi
            lean "$file"
          done
