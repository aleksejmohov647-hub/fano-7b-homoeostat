name: Lean 4 Formal Verification

on:
  push:
    branches: [ main ]
    paths:
      - '**.lean'
      - '.github/workflows/lean_verify.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Build & Check Zero-Sorry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan & Lean 4
        run: |
          wget -q https://githubusercontent.com -O /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:stable
          /home/runner/.elan/bin/lean --version

      - name: Audit for 'sorry' or custom axioms
        run: |
          if grep -rnE '\bsorry\b|\baxiom\b' --include="*.lean" .; then
            echo "Error: Found 'sorry' or custom 'axiom' in Lean files!"
            exit 1
          fi

      - name: Compile all standalone Lean 4 files
        run: |
          for f in $(find . -name "*.lean"); do
            echo "Verifying $f ..."
            /home/runner/.elan/bin/lean "$f"
          done
