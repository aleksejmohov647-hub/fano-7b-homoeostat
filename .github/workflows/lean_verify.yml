name: Lean 4 Formal Verification

on:
  push:
    branches: [ main ]
    paths:
      - '**.lean'
      - '.github/workflows/lean_verify.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Build & Check Zero-Sorry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lean 4
        uses: leanprover/lean-action@v1
        with:
          toolchain: leanprover/lean4:stable

      - name: Audit for 'sorry' or custom axioms
        run: |
          if grep -rnE '\bsorry\b|\baxiom\b' --include="*.lean" .; then
            echo "Error: Found 'sorry' or custom 'axiom' in Lean files!"
            exit 1
          fi

      - name: Compile all standalone Lean 4 files
        run: |
          for f in $(find . -name "*.lean"); do
            echo "Verifying $f ..."
            lean "$f"
          done
