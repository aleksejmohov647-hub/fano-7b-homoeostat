name: Build & Check Zero-Sorry

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-lean:
    name: Verify Lean 4 Certificates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        uses: leanprover/lean-action@v1
        with:
          toolchain: leanprover/lean4:stable
          use-github-cache: false

      - name: Audit for 'sorry' or custom axioms
        run: |
          if grep -rnE "^[[:space:]]*(axiom\b|.*:=\s*sorry\b|\bsorry\b)" SevenValuedLogic_UnifiedTimeQuantum_v6_0.lean; then
            echo "Error: 'sorry' or custom 'axiom' found!"
            exit 1
          fi

      - name: Compile Lean 4 file
        run: lean SevenValuedLogic_UnifiedTimeQuantum_v6_0.lean
