name: Build & Check Zero-Sorry

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSfL https://github.com -o lean.tar.zst
          tar --zstd -xf lean.tar.zst -C /tmp
          echo "/tmp/lean-4.14.0-linux/bin" >> $GITHUB_PATH

      - name: Audit for 'sorry' or custom axioms
        run: |
          if grep -rnE "\b(sorry|axiom)\b" --include="*.lean" .; then
            echo "Error: 'sorry' or custom 'axiom' found!"
            exit 1
          fi

      - name: Compile all standalone Lean 4 files
        run: |
          for f in $(find . -name "*.lean" ! -name "SevenValuedLogic_RigorousCore_v5_3.lean"); do
            echo "Verifying $f ..."
            lean "$f"
          done
