name: "Fano-Desargues Multi-Scale Gauge Trap"

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main

jobs:
  calibrate_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up C++ Build Tools (GCC)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Execute Macro-Scale Traffic Bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python v2_macro/traffic_bridge.py

      - name: Compile and Run C++ Meso-Scale Mesh Tester
        run: |
          g++ -O3 core/fano_mesh_tester.cpp -o core/fano_mesh_tester
          ./core/fano_mesh_tester

      - name: Auto-Commit Refined Dimension Scales
        run: |
          git config --global user.name "7n-Gauge-Automaton"
          git config --global user.email "automaton@7n.internal"
          if [ -n "$(git status --porcelain fano_params.vh)" ]; then
            git add fano_params.vh
            git commit -m "chore(core): auto-recalibration [phase mod 13]"
            git push origin main
          fi
