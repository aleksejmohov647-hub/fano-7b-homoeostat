name: "Fano Engine 7n Auto Run"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fano_core_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up C++ Build Tools (GCC)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Execute Macro-Scale Traffic Bridge
        run: python v2_macro/traffic_bridge.py

      - name: Compile and Run C++ Meso-Scale Mesh Tester
        run: |
          g++ -O3 core/fano_mesh_tester.cpp -o core/fano_mesh_tester
          ./core/fano_mesh_tester
